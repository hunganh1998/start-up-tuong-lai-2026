            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #e2ecf5;
            --ff: 'VT323', 'Consolas', 'Menlo', 'DejaVu Sans Mono', 'Courier New', monospace
        }

        @media (prefers-color-scheme:dark) {
             :root:not([data-theme="light"]) {
                --bg: #0d1424
            }
        }

         :root[data-theme="dark"] {
            --bg: #0d1424
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            height: 100%
        }

        body {
            margin: 0;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            height: 100%;
            background: var(--bg);
            display: grid;
            place-items: center;
            font-family: var(--ff)
        }

        canvas {
            touch-action: none;
            display: block;
            width: 100%;
            max-width: calc(100vh*16/9);
            height: auto;
            aspect-ratio: 16/9;
            image-rendering: pixelated
        }

        #tc {
            display: none;
            position: fixed;
            inset: 0;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none
        }

        #tc * {
            pointer-events: auto;
            touch-action: none
        }

        #js {
            position: absolute;
            left: max(18px, env(safe-area-inset-left));
            bottom: max(18px, env(safe-area-inset-bottom));
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ffffff33;
            border: 2px solid #ffffff99
        }

        #kn {
            position: absolute;
            left: 35px;
            top: 35px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffffffcc;
            pointer-events: none
        }

        #be,
        #ch button {
            border: 2px solid #fff;
            background: #1f52b0dd;
            color: #fff;
            font: 400 25px var(--ff)
        }

        #be {
            position: absolute;
            right: max(20px, env(safe-area-inset-right));
            bottom: max(20px, env(safe-area-inset-bottom));
            width: 90px;
            height: 90px;
            border-radius: 50%
        }

        #ch {
            position: absolute;
            right: max(20px, env(safe-area-inset-right));
            bottom: 130px;
            display: none;
            flex-direction: column-reverse;
            gap: 8px
        }

        #ch button {
            width: 64px;
            height: 56px;
            border-radius: 14px
        }

        #au {
            position: fixed;
            top: 34px;
            right: 8px;
            z-index: 9;
            background: #1f52b0dd;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 2px 6px;
            font: 400 13px var(--ff);
            cursor: pointer;
            user-select: none
        }

        #au.off {
            background: #7a2a2add
        }

        #be,
        #ch button,
        #au {
            box-shadow: 0 3px 0 #0a1f4a, 0 0 12px #0006;
            transition: transform .08s, background .1s
        }

        #be:active,
        #ch button:active,
        #au:active {
            transform: translateY(2px) scale(.94);
            background: #2f6bd0dd
        }

        #js {
            box-shadow: inset 0 0 16px #0004
        }

        #menu-btn {
            position: fixed;
            top: 34px;
            right: 64px;
            z-index: 9;
            background: #1f52b0dd;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 2px 6px;
            font: 400 13px var(--ff);
            cursor: pointer;
            user-select: none;
            box-shadow: 0 3px 0 #0a1f4a, 0 0 12px #0006
        }

        #menu-btn:active {
            transform: translateY(2px);
            background: #2f6bd0dd
        }

        #toasts {
            position: fixed;
            top: 58px;
            right: 8px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            max-width: 170px
        }

        .toast {
            background: linear-gradient(90deg, #f2c46b, #e8b058);
            color: #0e1730;
            padding: 3px 7px;
            border-radius: 5px;
            font: 400 12px var(--ff);
            border: 2px solid #fff;
            box-shadow: 0 3px 10px #0008;
            animation: tIn .35s cubic-bezier(.2, 1.4, .4, 1);
            line-height: 1.3
        }

        .toast.good {
            background: linear-gradient(90deg, #7fe08a, #5cba4c);
            color: #0a2810
        }

        .toast.bad {
            background: linear-gradient(90deg, #ff8a70, #e0362c);
            color: #fff
        }

        .toast small {
            font-weight: 400;
            opacity: .85
        }

        @keyframes tIn {
            from {
                transform: translateX(120%);
                opacity: 0
            }
            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        #menu {
            position: fixed;
            inset: 0;
            display: none;
            background: rgba(8, 14, 30, .95);
            z-index: 20;
            padding: 16px;
            overflow-y: auto;
            color: #fff;
            font: 400 16px var(--ff);
            backdrop-filter: blur(2px)
        }

        #menu.on {
            display: block;
            animation: mIn .25s
        }

        @keyframes mIn {
            from {
                opacity: 0;
                transform: scale(.98)
            }
            to {
                opacity: 1
            }
        }

        #menu h2 {
            color: #f2c46b;
            margin: 0 0 12px;
            font-size: 18px;
            border-bottom: 2px solid #2a4a8a;
            padding-bottom: 8px;
            padding-right: 44px
        }

        #menu h3 {
            color: #9fb4d8;
            margin: 14px 0 6px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        #menu .card {
            background: rgba(26, 36, 68, .9);
            border: 2px solid #2a4a8a;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            line-height: 1.5
        }

        #menu .btn {
            display: inline-block;
            background: #1f52b0;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 6px;
            padding: 8px 14px;
            font: 400 15px var(--ff);
            cursor: pointer;
            margin: 3px 3px 3px 0;
            user-select: none;
            transition: transform .08s, background .1s
        }

        #menu .btn:hover,
        #menu .btn:active {
            background: #2f6bd0;
            transform: translateY(-1px)
        }

        #menu .btn.g {
            background: #2a7a3a
        }

        #menu .btn.g:hover {
            background: #3a9a4a
        }

        #menu .btn.r {
            background: #8a2a2a
        }

        #menu .btn.r:hover {
            background: #a83a3a
        }

        #menu .close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #8a2a2a;
            border-color: #fff;
            width: 34px;
            height: 34px;
            padding: 0;
            text-align: center;
            line-height: 28px;
            font-size: 18px
        }

        .ach {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(42, 74, 138, .4)
        }

        .ach .ic {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            background: #0e1730;
            border-radius: 6px;
            font-size: 19px;
            flex-shrink: 0
        }

        .ach.locked {
            opacity: .35;
            filter: grayscale(1)
        }

        .ach .nm {
            color: #f2c46b;
            font-weight: 700;
            font-size: 14px
        }

        .ach .ds {
            color: #9fb4d8;
            font-size: 12px;
            font-weight: 400;
            margin-top: 2px
        }

        .tut {
            position: fixed;
            left: 50%;
            bottom: 130px;
            transform: translateX(-50%);
            background: rgba(14, 23, 48, .96);
            border: 2px solid #f2c46b;
            border-radius: 8px;
            padding: 5px 9px;
            color: #fff;
            font: 400 13px var(--ff);
            max-width: 260px;
            z-index: 14;
            box-shadow: 0 4px 16px #0008;
            animation: tIn .3s;
            line-height: 1.5;
            pointer-events: none
        }

        .tut b {
            color: #f2c46b;
            display: block;
            margin-bottom: 2px;
            font-size: 12px
        }

        .tut .hint {
            color: #9fb4d8;
            font-size: 12px;
            margin-top: 4px;
            font-weight: 400
        }

        .tut .hint.close {
            color: #f2c46b
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(42, 74, 138, .3);
            font-size: 14px
        }

        .stats-row .k {
            color: #9fb4d8
        }

        .stats-row .v {
            color: #fff;
            font-weight: 700
        }

        @media (max-width:520px) {
            #toasts {
                top: 58px;
                max-width: 140px
            }
            .toast {
                font-size: 11px;
                padding: 2px 5px
            }
            #menu {
                font-size: 14px;
                padding: 12px
            }
            .tut {
                bottom: 150px;
                font-size: 13px;
                padding: 8px 10px;
                max-width: 280px
            }
        }

            z-index: 20;
            right: max(8px, env(safe-area-inset-right));
            bottom: max(6px, env(safe-area-inset-bottom));
            padding: 3px 7px;
            border: 1px solid #74849a66;
            border-radius: 4px;
            color: #526176;
            background: transparent;
            border-color: transparent;
            opacity: .16;
            font: 12px/1.2 Arial, sans-serif;
            letter-spacing: .15px;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            text-shadow: 0 1px 0 #fff8;
        }
        @media (prefers-color-scheme: dark) {
            #ip-credit { color: #d5deed; background: #101827d9; border-color: #aab8cc55; text-shadow: none; }
        }
        .tut{left:auto!important;right:8px;top:96px!important;bottom:auto!important;transform:none!important;max-width:190px!important}
</style>

        function extrude(x, top, w, bot, wall, d, roof) {
            for (let i = 1; i <= d; i++) {
                R(x + i, top - i, w, 1, sh(roof, 1 - .06 * i));
                R(x + w - 1 + i, top - i, 1, bot - top + i, sh(wall, .66 - .03 * i));

            }
            R(x + w - 1 + d, top - d, 1, bot - top + d, sh(wall, .5))
        }

        function facade(x, top, w, h) {
            g.save();
            g.beginPath();
            g.rect(x, top, w, h);
            g.clip();
            for (let i = 0; i < h; i += 3) al(.2 * i / h, () => R(x, top + i, w, 3, '#0a1230'));

            });
            al(.3, () => R(x, top + h - 4, w, 4, '#0a1230'));
            g.restore()
        }

            const r = (((A >> 16) & 255) + (((B >> 16) & 255) - ((A >> 16) & 255)) * t) | 0;
            const g2 = (((A >> 8) & 255) + (((B >> 8) & 255) - ((A >> 8) & 255)) * t) | 0;
            const bl = ((A & 255) + ((B & 255) - (A & 255)) * t) | 0;
            return '#' + ((r << 16) | (g2 << 8) | bl).toString(16).padStart(6, '0');

                        'Broad-based weighted average, giới hạn phạm vi và thời hạn', 'Chấp nhận full ratchet để quỹ yên tâm', 'Từ chối mọi anti-dilution', 'Trả tiền mặt bù cho quỹ')

                b[k].forEach(q => q.id = k + ':' + q.topic)
            }
            return b

        function goto(c, x, y, sp, dt) {
            const dx = x - c.x,
                dy = y - c.y,
                d = Math.hypot(dx, dy);
            if (d < 1.2) {
                c.x = x;
                c.y = y;
                if (c.state === 'WALK') c.set('IDLE');
                return true
            }
            c.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
            c.set('WALK');
            const s = Math.min(d, sp * dt);
            c.x += dx / d * s;
            c.y += dy / d * s;
            return false
        }
        const run = (steps, done) => {
                G.seq = {
                    steps,
                    i: 0,
                    done
                }
            },
            act = f => () => {
                f();
                return true
            },
            walk = (c, x, y, sp) => dt => goto(c, x, y, sp, dt);
        const twn = (f, d) => {
            let e = 0;
            return dt => {
                e += dt;
                f(Math.min(1, e / d));
                return e >= d
            }
        };

        function talk(list, fin) {
            const [n, t, pg, npc] = list[0];
            G.dlg.open(G, {
                name: n,
                title: t,
                pages: pg,
                npc,
                topic: 'quest',
                done: () => {
                    list.length > 1 ? talk(list.slice(1), fin) : fin && fin()
                }
            });
            if (n === 'CEO' && npc) npc.set('THINKING')
        }
        const say = (n, t, pg, npc) => {
            let st = 0;
            return () => {
                if (!st) {
                    st = 1;
                    talk([
                        [n, t, pg, npc]
                    ], () => {
                        st = 2;
                        G.player.busy = true
                    })
                }
                return st === 2
            }
        };
        class Idler {
            constructor(seed, sts) {
                this.r = mulberry(seed);
                this.sts = sts;
                this.w = 1 + this.r() * 3;
                this.route = []
            }
            update(c, dt) {
                if (c.hold) return;
                if (this.route.length) {
                    if (goto(c, this.route[0][0], this.route[0][1], 36, dt)) {
                        this.route.shift();
                        if (!this.route.length) c.dir = 'down'
                    }

        function negoStart(k) {
            const s = qstate(k),
                n = s.nego;
            s.ph = 'nego';
            s.pre = Math.round(n.val0 * (1 + s.vm / 100));
            s.amount = s.trust < n.floor ? 0 : r1(n.ask * (.5 + .5 * Math.min(1, (s.trust - n.floor) / (n.full - n.floor))));
            if (!s.amount) {

                return finish(k)
            }
            s.eq = s.amount / (s.pre + s.amount);
            s.nr = 0;

            };

        }

        function finish(k) {
            const s = qstate(k),

                return dealFlow(k, 'B')
            }
            s.tier = (!s.amount || s.trust < n.floor) ? 0 : s.trust < n.full ? 1 : 2;
            if (!s.tier) s.amount = 0;
            talk([
                [inv.name, 'THỎA THUẬN SƠ BỘ', resPages(k), inv]
            ], () => {

                inv.busy = false;
                inv.set('IDLE');

            let c = EC[id];
            if (!c) {
                c = EC[id] = document.createElement('canvas');

                const q = c.getContext('2d');
                q.font = z + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
                q.textAlign = 'center';
                q.textBaseline = 'middle';
                q.fillText(e, c.width / 2, c.height / 2)
            }
            ctx.globalAlpha = a;
            ctx.drawImage(c, x * k - c.width * sc / 2, y * k - c.height * sc / 2, c.width * sc, c.height * sc);
            ctx.globalAlpha = 1
        }

        function mPick(n) {
            const q = G.q,
                s = q.qs[q.i],
                ch = s.c[n];
            if (!ch) return;
            q.good = ch.ok;
            if (ch.ok) q.ok++;
            q.rx = ch.ok ? 'ĐÚNG RỒI!' : 'CHƯA ĐÚNG. ĐÁP ÁN: ' + s.c.find(x => x.ok).t;
            q.mode = 'mr';

            const q = G.q,

            if (q.end) return mDone();

                return

            q.end = 1;
            q.rx = 'ĐÚNG ' + q.ok + '/' + n + (q.ok >= 2 ? MD[q.h.k] === CO.r ? '. ĐẠT! (ĐÃ NHẬN THƯỞNG VÒNG NÀY)' : '. ĐẠT! NHẬN THƯỞNG.' : '. CHƯA ĐẠT, THỬ LẠI NHÉ.')

        const collatVal = () => r1(Math.max(.8, CO.cash * .5 + CO.rev * 1 + CO.r * 1));

        function loanScore(k, type, purpose) {
            const L = INVESTOR_OFFICES[k].loanCfg;
            const runway = CO.cash / CO.burn,
                mRev = CO.rev / 12,
                mProf = mRev - CO.burn;
            let s = 40;
            s += Math.min(12, CO.months * .8);
            s += Math.min(15, CO.rev * 5);
            s += Math.max(-8, Math.min(12, mProf * 70));
            s += Math.min(12, runway * 1.4);
            s += (CO.credit - 50) * .3;
            s -= Math.min(20, CO.debt * 5);
            s += (CO.prep.fin ? 5 : 0) + (CO.prep.law ? 5 : 0) + (CO.prep.audit ? 4 : 0);
            if (type === 'secured') s += Math.min(18, collatVal() * 6);
            else s -= 8;
            s += LPURPW[purpose] || 0;
            return Math.round(s)
        }

        function loanEval(k, type, amount, purpose) {
            const L = INVESTOR_OFFICES[k].loanCfg,
                mRev = CO.rev / 12,
                mProf = mRev - CO.burn,
                sc = loanScore(k, type, purpose),
                min = L.minScore[type],
                rate = L.rate[type],
                n = L.term,
                i = rate / 100 / 12,
                A = i * Math.pow(1 + i, n) / (Math.pow(1 + i, n) - 1);
            let cap = type === 'secured' ? Math.min(L.maxSecured, collatVal() * L.collatMult * 1.3) : Math.min(L.maxUnsecured, Math.max(.3, mRev * 3));
            cap = Math.max(0, cap - CO.debt * .7);
            const maxPay = Math.max(0, mProf * .55),
                payCap = maxPay > 0 ? maxPay / A : 0;
            cap = Math.min(cap, payCap);
            const reasons = [];
            let status = 'approved',
                amt = amount;
            if (type === 'secured' && collatVal() <= 0) {
                status = 'rejected';
                amt = 0;
                reasons.push('CHƯA CÓ TÀI SẢN ĐẢM BẢO')
            } else if (sc < min) {
                status = 'rejected';
                amt = 0;
                reasons.push('ĐIỂM TÍN DỤNG ' + sc + '/' + min + ': CHƯA ĐẠT')
            } else if (cap < amount) {
                status = 'reduced';
                amt = r1(Math.max(.2, cap));
                reasons.push('SỐ TIỀN VƯỢT KHẢ NĂNG TRẢ NỢ');
                reasons.push('NGÂN HÀNG GIẢM CÒN ' + amt + ' TRIỆU USD')
            } else reasons.push('HỒ SƠ ĐẠT YÊU CẦU');
            if (status === 'approved') reasons.push('NGÂN HÀNG CHẤP THUẬN ' + amt + ' TRIỆU USD');
            if (status === 'rejected') {
                const r = CO.cash / CO.burn;
                reasons.push('LÝ DO: ' + (r < 3 ? 'RUNWAY DƯỚI 3 THÁNG' : CO.credit < 60 ? 'ĐIỂM TÍN DỤNG THẤP' : 'HỒ SƠ CHƯA ĐỦ MẠNH'))
            }
            const monthly = amt > 0 ? r1(amt * A) : 0,
                total = r1(monthly * n),
                interest = r1(total - amt);
            return {
                score: sc,
                min,
                status,
                amount: amt,
                rate,
                term: n,
                monthly,
                total,
                interest,
                cap: r1(cap),
                reasons
            }
        }

        function loanAmounts(k, type) {
            const L = INVESTOR_OFFICES[k].loanCfg,
                b = type === 'secured' ? Math.max(.5, CO.rev * 1.2) : Math.max(.3, CO.rev * .6),
                cap = type === 'secured' ? L.maxSecured : L.maxUnsecured,
                o = [b, b * 2, b * 3, b * 5].map(v => r1(Math.min(v, cap)));
            return o.filter((v, i, a) => v > 0 && a.indexOf(v) === i)
        }

        function loanStart(k) {
            const inv = G.map.inv,

        function loanPick(n) {
            const q = G.q,
                k = q.k;
            AU.sfx('select');
            if (q.mode === 'Lt') {
                if (n > 1) return;
                q.type = n ? 'unsecured' : 'secured';
                q.opts = loanAmounts(k, q.type);
                q.mode = 'La';
                return
            }
            if (q.mode === 'La') {
                if (n >= (q.opts || []).length) return;
                q.amount = q.opts[n];
                q.mode = 'Lp';
                return
            }
            if (q.mode === 'Lp') {
                if (n >= LPURP.length) return;
                q.purpose = n;
                q.eval = loanEval(k, q.type, q.amount, n);
                q.mode = 'Lr';
                return
            }
        }

            ddO = () => Math.min(3, (CO.credit < 60) + (CO.rep > 0) + (Math.random() < .35) + CHX.rk('oth'));

        function ddApply(s, t, v) {
            const tr0 = s.trust,
                p0 = s.pre,
                a0 = s.amount,
                T = [
                    [0, 0],
                    [3, 0],
                    [8, .12],
                    [22, .3]
                ][v];
            s.trust = cl(s.trust - (t === 'oth' ? T[0] * .7 : T[0]));
            if (t === 'fin' && v > 1) {
                s.pre = Math.round(s.pre * (1 - T[1]));
                if (v > 2) s.amount = r1(s.amount * .8)
            }
            if (t === 'law') {
                if (v === 2) s.lh = (s.lh || 0) + 5;
                if (v === 3) {
                    s.lh = (s.lh || 0) + 8;
                    s.pre = Math.round(s.pre * .85)
                }
            }
            if (t === 'oth') {
                if (v === 2) s.amount = r1(s.amount * .9);
                if (v === 3) s.pre = Math.round(s.pre * .9)
            }
            if (v === 1) CO.cash = r1(CO.cash - CO.burn * .2);
            return v ? `TIN TƯỞNG -${Math.round(tr0-s.trust)}${s.pre!==p0?', VPRE '+p0+'->'+s.pre+'M':''}${s.amount!==a0?', VỐN '+a0+'->'+s.amount+'M':''}${t==='law'&&s.lh?', SÁNG LẬP -'+s.lh+'% CAP TABLE':''}` : 'KHÔNG ĐIỀU CHỈNH'
        }

        function dealFlow(k, ph) {
            const s = qstate(k),
                c = INVESTOR_OFFICES[k],
                inv = G.map.inv,
                N = c.name;
            if (ph === 'A') {
                const vs = [
                    ['fin', 'KẾ MÈ AUDIT - DD TÀI CHÍNH', ddF()],
                    ['law', 'LUẬT SƯ - DD PHÁP LÝ', ddL()]
                ];
                if (CO.r > 0) vs.push(['oth', 'CHUYÊN GIA ' + DXS[ST.k] + ' - DD', ddO()]);
                const post = s.pre + s.amount,
                    L = [
                        [N, 'TERM SHEET', [`Vpre ${s.pre}M + I ${s.amount}M = Vpost ${post}M. Quỹ nắm I/Vpost = ${(s.eq*100).toFixed(1)}%.`, 'Điều kiện: thẩm định tài chính, pháp lý, hồ sơ pháp lý, ủy ban đầu tư. KHÔNG GIẢI NGÂN TRƯỚC CLOSING.'], inv]
                    ];
                vs.forEach(([t, n, v]) => {
                    const e = ddApply(s, t, v);
                    L.push([n, 'KẾT QUẢ DD: ' + SVR[v],
                        [DXT[t][v], e]
                    ]);
                    CH.log.push(n.split(' - ')[0] + ': ' + SVR[v])
                });
                s.eq = s.amount / (s.pre + s.amount);
                const mj = Math.max(...vs.map(x => x[2]));
                talk(L, () => {
                    if (s.amount <= 0 || s.trust < s.nego.floor) {
                        s.tier = 0;
                        s.amount = 0;
                        return settle(k)
                    }

                        s.end = 0;
                        G.player.busy = true;
                        G.player.set('THINKING');

                            mode: 'nego',

                        };

                            t: 0
                        }
                    } else dealFlow(k, 'B')
                })
            } else {
                const post = s.pre + s.amount,
                    fee = r1(Math.max(.02, s.amount * (CO.prep.law ? .015 : .03))),
                    mx = mxs(c, k) || 1,

                ];
                if (ok) L.push([N, 'CLOSING', ['Điều kiện tiên quyết: báo cáo tài chính đã xác nhận, hồ sơ pháp lý đã ký, không có thay đổi bất lợi.', `Đã thỏa mãn. Giải ngân ${s.amount}M, trừ phí ${fee}M, ghi nhận ${(s.eq*100).toFixed(1)}% cho quỹ.`], inv]);

                        s.amount = 0;

                    }
                    settle(k)
                })
            }

                rz = i => Z('RỦI RO: ' + r[i].toUpperCase(), `${n} đối mặt rủi ro ${r[i]}. Bạn đối phó thế nào?`, `Quỹ muốn kế hoạch cụ thể cho rủi ro ${r[i]}, không phải lời trấn an.`, `Có quy trình và người phụ trách riêng cho ${r[i]}`, 'Rủi ro này không đáng kể', 'Sẽ tính khi sự cố xảy ra', 'Giao hết cho nhà đầu tư lo');
            return {

                ],

            }

        /* ================= QUESTION BANK: KẾ TOÁN / LUẬT SƯ / KIỂM TOÁN =================

            return [

                [`${n} giải quyết vấn đề gì cho ${cu}?`, pb, 'Thiếu vốn của nhà đầu tư', 'Giá điện tăng'],
                [`${n} thu tiền theo mô hình nào?`, rm, 'Bán dữ liệu khách hàng', 'Chờ nhà đầu tư rót vốn'],
                [`Chỉ số quan trọng nhất để đo ${n}?`, m[0], 'Số lượt chia sẻ mạng xã hội', 'Số nhân viên mới'],
                [`Rủi ro lớn của ${n} trong ngành này là gì?`, r[0], 'Thời tiết đổi mùa', 'Đổi màu logo'],
                [`${n} gọi ${S.ask}M USD, burn ${S.burn}M/tháng. Vốn đủ cho khoảng bao nhiêu tháng?`, rn + ' tháng', rn * 2 + ' tháng', Math.max(1, rn >> 1) + ' tháng'],
                [`${n} gọi ${S.ask}M USD ở Vpre ${S.val}M. Quỹ nắm khoảng bao nhiêu?`, S.eq + '%', r1(S.ask / S.val * 100) + '%', r1(100 - S.eq) + '%'],

/* ============ DRAW BUILDING (2.5D) ============ */
function drawCBShop(b,i){
  S(4100+i*17);
  const{x,w,top,wall,roof,acc,style}=b;
  const cx=x+w/2|0;
  /* shadow */
  g.globalAlpha=.22;R(x,top,w,BASE-top,'#0a1230');g.globalAlpha=1;
  /* body */
  R(x,top,w,BASE-top,wall);
  R(x,top,1,BASE-top,sh(wall,1.28));
  R(x+w-1,top,1,BASE-top,sh(wall,.68));
  /* roof band */
  R(x-1,top-6,w+2,6,roof);
  R(x-1,top-6,w+2,1,sh(roof,1.35));
  R(x-1,top-1,w+2,1,sh(roof,.6));
  /* awning per style */
  if(style==='wood'||style==='warm'||style==='bright'){
    for(let k=x;k<x+w;k+=6){
      const on=((k-x)/6|0)%2;
      R(k,top+6,6,5,on?acc:'#f4f2ec');
    }
    R(x,top+11,w,1,sh(acc,.6));
    R(x,top+6,w,1,'#ffffff');
  } else if(style==='neon'){
    R(x+2,top+4,w-4,3,acc);
    R(x+2,top+4,w-4,1,'#ffffff');
    g.globalAlpha=.35;disc(cx,top+5,10,acc);g.globalAlpha=1;
  } else if(style==='clean'){
    R(x+2,top+6,w-4,4,'#f4f8fa');
    R(x+2,top+6,w-4,1,'#ffffff');
    R(x+2,top+9,w-4,1,sh('#f4f8fa',.7));
  } else if(style==='paper'){
    R(x+3,top+5,w-6,6,'#f8eedc');
    R(x+3,top+5,w-6,1,'#c8a888');
    R(x+3,top+10,w-6,1,'#c8a888');
  } else if(style==='pastel'){
    for(let k=x;k<x+w;k+=8){
      R(k,top+5,8,6,((k-x)/8|0)%2?'#f4c8c8':'#ffffff');
    }
    R(x,top+10,w,1,sh(wall,.7));
  }
  /* display windows with items */
  for(let ry=top+16;ry<BASE-14;ry+=16){
    R(x+3,ry,w-6,10,'#2e2018');
    R(x+3,ry,w-6,1,'#0a0804');
    for(let k=x+6;k<x+w-6;k+=8){
      const it=CB_ITEMS[b.inv[(i+k/8|0)%b.inv.length]];
      R(k,ry+2,5,7,it.col);
      R(k,ry+2,5,1,sh(it.col,1.3));
      px(k+2,ry+5,sh(it.col,.7));
    }
    R(x+2,ry-2,w-4,1,sh(wall,.7));
  }
  /* door (2.5D) */
  const dcx=cx;
  R(dcx-9,BASE-18,18,18,'#3a2a1a');
  R(dcx-9,BASE-18,18,1,'#5e3e26');
  R(dcx-9,BASE-18,1,18,'#5e3e26');
  R(dcx+8,BASE-18,1,18,sh('#3a2a1a',.7));
  R(dcx-7,BASE-15,14,14,'#88d6ff');
  R(dcx-7,BASE-15,14,1,'#cfe8ff');
  px(dcx+6,BASE-8,'#e4ac40');
  /* sign 2.5D */
  const sw=tw(b.n)+10, sy=top-22;
  g.globalAlpha=.4;R(x+cx-1,sy+2,sw+2,12,'#000');g.globalAlpha=1;
  R(x+cx-sw/2-1,sy,sw+2,12,sh(roof,.7));
  R(x+cx-sw/2-1,sy,sw+2,1,sh(roof,1.4));
  R(x+cx-sw/2,sy+1,sw,10,acc);
  R(x+cx-sw/2,sy+1,sw,1,sh(acc,1.4));
  R(x+cx-sw/2,sy+10,sw,1,sh(acc,.6));
  textC(b.n,cx,sy+4,'#ffffff');
  /* flag */
  R(x+w-4,top-28,1,28,'#ccd2dc');
  px(x+w-4,top-29,'#f4d468');
  /* Do not mutate the shared FLAGS registry while rendering. */
  /* entrance mat */
  R(dcx-12,BASE,24,2,'#8e4f2c');
  R(dcx-12,BASE,24,1,'#5e2e14');
  /* blinking corner lights */
  const on=(G.time*2|0)%2;
  px(x+cx-sw/2,sy+2,on?'#ffd24a':'#8e6e3e');
  px(x+cx+sw/2-1,sy+2,on?'#ffd24a':'#8e6e3e');
}

/* --- cửa sổ nhìn ra phố (sync sky) --- */
function cbWindow(x,y,w,h,ti){
  R(x-2,y-2,w+4,h+4,'#5e4028');
  R(x-2,y-2,w+4,1,sh('#5e4028',1.5));
  const hh=((DAY.h%24)+24)%24, sky=skyCols(hh);
  for(let i=0;i<h;i++){
    const k=i/h, c=lerpC(sky[0],sky[sky.length-1],k);
    R(x,y+i,w,1,c);
  }
  S(2900+ti);
  for(let i=0;i<3;i++){
    const bx=x+4+i*Math.floor(w/3), bh=3+((i*7+ti)%5);
    R(bx,y+h-bh,Math.floor(w/3)-3,bh,'#2a3350');
    for(let j=0;j<bh-1;j++)px(bx+1,y+h-bh+1+j,((i+j)%3)?'#5e4028':'#f4cb78');
  }
  g.globalAlpha=.55;
  const cw=Math.sin(G.time*.4+ti)*8;
  disc(x+w*.4+cw|0,y+4,3,'#e8f2fa');
  disc(x+w*.6+cw|0,y+6,2,'#c2d8ec');
  g.globalAlpha=1;
  R(x+Math.floor(w/2),y,1,h,'#5e4028');
  R(x,y+Math.floor(h/2),w,1,'#5e4028');
  if(hh>=18||hh<6){
    for(let i=0;i<6;i++){
      const gx=x+3+(i*7+ti*3)%(w-6), gy=y+2+((G.time*20+i*5)%(h-4));
      px(gx|0,gy|0,'#aed8f4'); px(gx|0,gy+1|0,'#88d6ff');
    }
  }
}

      for(let y=146,r=0;y<H;y+=6,r++){
        R(0,y,W,1,st.floor2);
        const off=(r%2)*8;
        for(let x=-off;x<W;x+=16)R(x,y,8,6,sh(st.floor,1));
      }
    } else if(pat==='tile'){
      for(let y=146,r=0;y<H;y+=8,r++){

function cbOpenShop(cashier){
  const p=G.player, sid=G.map.cbShop;
  p.busy=true; p.set('INTERACT');
  cashier.busy=true; cashier.set('TALK');
  const dx=p.x-cashier.x;
  cashier.dir=dx<0?'right':'left';
  p.dir=dx<0?'left':'right';
  G.q={mode:'cbShop',sel:0,sid,who:cashier};
  AU.sfx('ui');
}
function cbBuy(n){
  const q=G.q; if(!q||q.mode!=='cbShop')return;
  const shop=CB_SHOPS.find(s=>s.id===q.sid); if(!shop)return;
  const inv=shop.inv;
  if(n<0||n>=inv.length)return;
  const it=CB_ITEMS[inv[n]];
  if(CO.cash<it.price){AU.sfx('neg');G.toast={s:'KHÔNG ĐỦ TIỀN!',t:0};return}
  CO.cash=r1(CO.cash-it.price);
  if(it.fx.m)CO.mor=cl((CO.mor||60)+it.fx.m);
  if(it.fx.cr)CO.credit=cl(CO.credit+it.fx.cr);
  if(it.fx.t)CO.venueTrust=r1((CO.venueTrust||0)+it.fx.t);
  if(it.fx.prep){CO.prep[it.fx.prep]=1;CH.log.push('Mua '+it.n+' tại '+shop.n)}
  addPts(2);
  G.toast={s:'MUA: '+it.n+' (-'+it.price+'M)',t:0};
  AU.sfx('coin');
  G.player.emote('HAPPY',1.2);
  Pts.pop('-'+it.price+'M','good');
}
function cbMove(d){
  const q=G.q; if(!q||q.mode!=='cbShop')return;
  const shop=CB_SHOPS.find(s=>s.id===q.sid); if(!shop)return;
  const n=shop.inv.length, cols=n<=2?2:n<=4?4:3;
  let s=q.sel;
  if(d==='left') s=(s-1+n)%n;
  else if(d==='right') s=(s+1)%n;
  else if(d==='up') s=(s-cols+n)%n;
  else if(d==='down') s=(s+cols)%n;
  q.sel=s; AU.sfx('ui');
}

    const shop=CB_SHOPS[G.target.cbIdx];
    if(shop)return enterCBShop(shop.id);

};

const _iuCB=InteractionManager.prototype.update;
InteractionManager.prototype.update=function(G){
  _iuCB.call(this,G);
  if(G.q||G.dlg.on||G.pan)return;
  const m=G.map, p=G.player;
  /* detect shop doors */
  if(m.key==='chuaBoc'){
    CB_SHOPS.forEach((s,i)=>{
      const cx=s.x+(s.w>>1);
      if(Math.abs(p.x-cx)<10&&p.y>=160&&p.y<=170&&!G.target) G.target={cbIdx:i};
    });
  }
  /* detect exit door trong interior */
  if(m.cbShop&&Math.abs(p.x-16)<18&&p.y<=168&&!G.target){
    G.target={cbExit:1};
  }
};

addEventListener('keydown',e=>{
  if(!G||!G.q||G.q.mode!=='cbShop')return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();cbMove('left')}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();cbMove('right')}
  else if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();cbMove('up')}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();cbMove('down')}
  else if(e.code==='Enter'||e.code==='Space'){e.preventDefault();cbBuy(G.q.sel)}
  else if(e.code==='Escape'){e.preventDefault();G.q=null;G.player.busy=false;AU.sfx('ui')}
});

const _b2 = beginRound, _a2 = askQ, _n2 = negoStart, _d2 = dealFlow, _s2 = setupChapter;
beginRound = function(k) {
    const r = _b2.apply(this, arguments);
    qstate(k).dv = {tg: {}, ty: {}, ids: {}, n: 0};
    DL.q = [];
    return r
};
askQ = function(k) {
    const s = qstate(k);
    if (s.dv && !s.dv.mid && s.i === 2 && s.i < s.qs.length) return s.dv.mid = 1, stage(k, 'mid', () => _a2(k));
    return _a2(k)
};
negoStart = function(k) {
    const s = qstate(k);
    if (s.dv && !s.dv.pre) return s.dv.pre = 1, stage(k, 'pre', () => {
        G.player.busy = true;
        G.map.inv.busy = true;
        _n2(k)
    });
    return _n2(k)
};
dealFlow = function(k, ph) {
    const s = qstate(k), f = ph === 'A' ? 'fdd' : 'fic';
    if (s.dv && !s.dv[f]) return s.dv[f] = 1, stage(k, ph === 'A' ? 'dd' : 'ic', () => _d2(k, ph));
    return _d2(k, ph)
};
setupChapter = function() {
    _s2.apply(this, arguments);
    DL.q = [];
    DL.done = {}
};

    return {rk: t => X.rk.filter(r => r === t).length, CHD, cur, X, DLD, DL}
})();
